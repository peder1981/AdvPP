name: Release

on:
  push:
    # Só tags de versão do compilador (v2.0.17), não "vscode-2.0.17" (release
    # só da extensão) — "v*" também casava com essas, e o VERSION derivado
    # (GITHUB_REF_NAME menos o "v" inicial) virava "scode-2.0.17", quebrando
    # o Version do pacote .deb (precisa começar com dígito).
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.27"

jobs:
  # CLI advplc: puro Go (CGO_ENABLED=0), cross-compilado de um único runner
  cli-cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Cross-compile advplc
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make package VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-packages
          path: |
            dist/advpp-cli-*.tar.gz
            dist/advpp-cli-*.zip

  # Suite completa (inclui GUIs Fyne): build nativo em cada plataforma
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: windows-latest
            platform: windows-amd64
          - os: macos-latest
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Fyne dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: Build all tools
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          mkdir -p out
          for t in advplc adveditor advpp-ide; do
            go build -trimpath -ldflags "-s -w -X main.version=v$VERSION" -o "out/$t$EXT" "./cmd/$t"
          done
      - name: Build advpp-dbapi-bridge (Linux)
        # Ponte C++ AdvPP <-> dbapi.so TOTVS (dlopen/pthread — POSIX).
        # Vai para out/ junto do advplc: o auto-spawn do driver DBACCESS
        # procura o binário no mesmo diretório do executável. O dbapi.so
        # é proprietário e NÃO é distribuído — o usuário o obtém da
        # instalação TOTVS e o auto-spawn o encontra via ADVPP_DBAPI_SO
        # ou nos diretórios padrão.
        if: runner.os == 'Linux'
        run: ./tools/dbapi-bridge/build.sh out/advpp-dbapi-bridge
      - name: Package (tar.gz / zip)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="advpp-$VERSION-${{ matrix.platform }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd out && 7z a "../dist/$NAME.zip" .) > /dev/null
          else
            tar czf "dist/$NAME.tar.gz" -C out .
          fi
      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=pkgroot
          mkdir -p $PKG/DEBIAN $PKG/usr/bin
          cp out/advplc out/adveditor out/advpp-ide out/advpp-dbapi-bridge $PKG/usr/bin/
          cat > $PKG/DEBIAN/control <<EOF
          Package: advpp
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: amd64
          Maintainer: AdvPP Team <peder1981@gmail.com>
          Depends: libc6, libgl1, libx11-6
          Description: AdvPL/TLPP Development Tools
           Compiler (advplc), IDE (advpp-ide), and database/dictionary
           editor (adveditor) for the AdvPL/TLPP language. All tools share
           the same SQLite database (~/.advpp/ADVPP.db).
          EOF
          dpkg-deb --build --root-owner-group $PKG "dist/advpp_${VERSION}_amd64.deb"
      # Depois do zip, de proposito: o Mesa entra so no instalador, nao no
      # pacote solto. As duas GUIs (advpp-ide, adveditor) sao Fyne e morrem
      # em maquina sem driver de video; o instalador oferece a renderizacao
      # por software como opcao marcavel, e ainda poe o advplc no PATH.
      - name: Instalador Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MESA_VERSAO: 26.1.4
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          curl -fsSL -o mesa.7z \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSAO}/mesa3d-${MESA_VERSAO}-release-msvc.7z"
          7z e -y mesa.7z x64/opengl32.dll x64/libgallium_wgl.dll -oout/mesa
          # Fontes do modulo Go: o stub gerado por `advplc build` importa
          # este modulo, entao ele tem que existir em disco na maquina do
          # usuario. So pkg/, cmd/ e os arquivos de modulo -- ~7 MB, contra
          # 636 MB do repositorio inteiro.
          mkdir -p out/advpp-src
          cp -r pkg cmd go.mod go.sum out/advpp-src/
          du -sh out/advpp-src
          # Os .bat vao para out/ junto do .iss: o ISCC resolve Source
          # relativo ao diretorio do proprio .iss, e aqui ele roda de out/.
          cp installer/advpp.iss installer/*.bat out/
          choco install innosetup --no-progress -y
          # // e o escape do MSYS: com /D simples o bash converteria o
          # argumento num caminho do Windows antes do ISCC ver.
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            //DAppVersion="$VERSION" out/advpp.iss
          mkdir -p dist && mv out/AdvPP-Setup-*.exe dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.exe

  release:
    needs: [cli-cross, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Integridade dos pacotes
        # Nomes repetidos entre jobs viravam um arquivo só, com os bytes
        # misturados (merge-multiple) — o workflow ficava verde e a release
        # saía com tar.gz/zip corrompido. Agora falha aqui.
        run: |
          shopt -s nullglob
          ls -la artifacts
          # gzip -t também pega "trailing garbage" (sai 2), sintoma já presente na v4.6.1
          for f in artifacts/*.tar.gz; do { gzip -t "$f" && tar tzf "$f" >/dev/null; } || { echo "CORROMPIDO: $f"; exit 1; }; echo "ok $f"; done
          for f in artifacts/*.zip; do unzip -tq "$f" || { echo "CORROMPIDO: $f"; exit 1; }; echo "ok $f"; done
          for f in artifacts/*.deb; do dpkg-deb --info "$f" >/dev/null || { echo "CORROMPIDO: $f"; exit 1; }; echo "ok $f"; done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-run de uma tag: substitui só a release, NUNCA a tag (antes a
          # tag era apagada e recriada a partir do HEAD do master, podendo
          # apontar para outro commit). --verify-tag exige a tag existente.
          gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes || true
          for i in 1 2 3; do
            if gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "AdvPP $GITHUB_REF_NAME" \
              --generate-notes \
              artifacts/*; then
              exit 0
            fi
            echo "Tentativa $i/3 falhou. Aguardando 5s..."
            sleep 5
          done
          echo "Falha ao criar a release" >&2
          exit 1
