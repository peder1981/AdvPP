name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.27"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: linux-arm64 é embutido na extensão VS Code
        # (tools/vscode-advpl/build-vsix.sh) — precisa ser testado nativo.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Fyne dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - name: go vet
        # -unsafeptr=false: pkg/vm/dyncall_native.go implementa FFI real
        # (DynCall/tRunDll) e precisa desreferenciar endereços de memória
        # crus vindos de fora do heap Go (Dlsym de uma DLL/SO carregada
        # em runtime) — o único uso de unsafe.Pointer neste projeto. O
        # analisador unsafeptr do vet não sabe distinguir "endereço C
        # legítimo" de "inteiro arbitrário" e sinaliza todo esse padrão
        # por design; documentado em pkg/vm/dyncall_native.go e
        # docs/tdn-known-limitations.md. Todos os demais analisadores do
        # vet continuam ativos.
        run: go vet -unsafeptr=false ./...
      - name: go test
        # Testes que dependem do modelo Falcon3-1.58bit (~2.2GB, não
        # versionado) ou do binário llama-cli de referência pulam sozinhos
        # via os.Stat — não é preciso -short para eles rodarem em CI.
        run: go test ./...
      - name: go test -race (pacotes concorrentes)
        # REST, webui e VM (SSE, canal PO-UI, VMs-filhas por requisição).
        # -race exige CGO, por isso só no runner Linux x64. checkptr=0: o
        # -race liga o checkptr, que acusa a aritmética de ponteiro do
        # DynCall (mesma exceção do -unsafeptr=false do go vet acima).
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -gcflags=all=-d=checkptr=0 ./pkg/rest ./pkg/webui ./pkg/vm
      - name: Bytecode hashes (determinismo entre SOs)
        # Grava sha256 do bytecode de todo fonte em examples/ e tests/; o
        # job `determinism` abaixo exige que os 4 runners gerem o mesmo.
        shell: bash
        env:
          ADVPP_BYTECODE_HASHES: ${{ github.workspace }}/bytecode-hashes.txt
        run: go test ./cmd/advplc -run TestBytecodeDeterminism -count=1
      - uses: actions/upload-artifact@v4
        with:
          name: bytecode-hashes-${{ matrix.os }}
          path: bytecode-hashes.txt
      - name: Cross-compile (alvos publicados)
        # CLI é Go puro (CGO_ENABLED=0): os alvos da release e da extensão
        # VS Code têm que compilar a partir de qualquer SO.
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/arm64 darwin/amd64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go vet -unsafeptr=false ./pkg/... ./cmd/advplc
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/advplc
          done
      - name: Standalone executable smoke test (Windows)
        # Só builda e RODA (não só "builda") um executável standalone
        # gerado por `advplc build` num runner Windows nativo de verdade —
        # é a única forma real de confirmar que o stub (janela Fyne +
        # console + banco) funciona no alvo em que mais importa: um app
        # GUI-subsystem sem terminal anexado, onde ConOut sem essa janela
        # simplesmente desapareceria.
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 3
        env:
          ADVPP_STUB_TRACE: "1"
        run: |
          go build -o advplc.exe ./cmd/advplc
          ./advplc.exe build tests/standalone_console_test.prw -o standalone_smoke.exe
          # Run detached with our own poll+kill instead of `output=$(...)`:
          # command substitution blocks until the process exits, so a hang
          # would show zero output at all (even from ADVPP_STUB_TRACE) —
          # writing to a file lets us see whatever DID happen even if it
          # never finishes.
          ./standalone_smoke.exe > out.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          hung=0
          if kill -0 $pid 2>/dev/null; then
            echo "FAIL: process still running after 30s (should exit on its own), killing"
            kill -9 $pid 2>/dev/null || true
            hung=1
          fi
          echo "--- out.log ---"
          cat out.log
          echo "---------------"
          grep -q "standalone smoke test: linha 1" out.log
          grep -q "standalone smoke test: linha 2" out.log
          # A forced kill means the exe hung instead of exiting on its own —
          # that's the actual bug under test, so it must fail the step even
          # though the expected output made it into out.log before the kill.
          test "$hung" -eq 0

  determinism:
    # A mesma revisão precisa gerar bytecode idêntico em Linux (amd64/arm64),
    # Windows e macOS. Diferença aqui = compilação dependente de SO (fim de
    # linha, separador de caminho, ordem de map, float...) — bug, não flake.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bytecode-hashes-*
      - name: Comparar hashes
        shell: bash
        run: |
          ref=bytecode-hashes-ubuntu-latest/bytecode-hashes.txt
          echo "$(wc -l < "$ref") fontes"
          fail=0
          for f in bytecode-hashes-*/bytecode-hashes.txt; do
            if ! diff -u "$ref" "$f"; then echo "DIVERGE: $f"; fail=1; fi
          done
          exit $fail
